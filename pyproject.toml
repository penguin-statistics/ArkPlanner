[project]
name = "arkplanner"
version = "1.3.0"
description = "ArkPlanner backend inside Penguin Statistics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "numpy>=2.5.4",
    # sanic-ext 25.12 imports pydantic unconditionally but does not declare it
    # (https://github.com/sanic-org/sanic-ext/issues/287); without it the app
    # fails to start with "No module named 'pydantic'".
    "pydantic>=2.14.1",
    "sanic>=25.12.1",
    "sanic-ext>=25.12.0",
    "scipy>=1.18.1",
]
