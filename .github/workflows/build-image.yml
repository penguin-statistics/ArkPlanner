name: Build Docker Image (Release)

on:
  push:
    # trigger on version tag push, e.g. v1.3.0
    tags:
      - "v*"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Metadata: Git"
        id: git-meta
        uses: "penguin-statistics/actions/git-meta@main"

      # Pushes ghcr.io/penguin-statistics/planner-backend:<tag> and :latest
      - name: "Docker: Build and Push Image"
        uses: "penguin-statistics/actions/ghcr-docker@main"
        with:
          version: ${{ steps.git-meta.outputs.version }}
          repository: "penguin-statistics/planner-backend"
